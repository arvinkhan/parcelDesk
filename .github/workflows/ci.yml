name: Verify
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: parceldesk
          POSTGRES_PASSWORD: parceldesk
          POSTGRES_DB: parceldesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parceldesk -d parceldesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://parceldesk:parceldesk@localhost:5432/parceldesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check public/app.js
      - run: npm test
